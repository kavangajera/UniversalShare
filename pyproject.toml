[project]
name = "universalshare"
version = "1.0.0"
description = "Share files instantly across any device via web browser — no app install needed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.28",
    "uvicorn>=0.46.0",
    "aiofiles>=25.1.0",
    "qrcode>=8.2",
    "websockets>=16.0",
]

[project.scripts]
universalshare = "app.main:main"
